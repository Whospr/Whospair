android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kapt.use.worker.api=false
kapt.incremental.apt=false
# tor-android est compilé en Java 24 (classfile 68) que Jetifier ne sait pas lire ;
# il est déjà en AndroidX, donc inutile de le transformer.
android.jetifier.ignorelist=tor-android,bcprov
